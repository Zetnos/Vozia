<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090c0a">
  <title>Meu espaço — Vozia</title><link rel="icon" href="/vozia-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/auth.css">
  <style>
    body{min-height:100vh}.workspace{width:min(1080px,calc(100% - 36px));margin:40px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.top .auth-brand{margin:0}.actions{display:flex;align-items:center;gap:10px}.actions a,.actions button,.job-link{border:1px solid #2d382b;border-radius:9px;background:#131814;color:#e8eee7;padding:11px 15px;text-decoration:none;font:inherit;cursor:pointer}.actions .primary,.job-link{background:#cbee3f;color:#11160d;border-color:#cbee3f;font-weight:700}.welcome{margin:34px 0}.welcome h1{font-size:clamp(28px,5vw,42px);margin:6px 0}.muted{color:#a3aca2}.panel{border:1px solid #273027;background:#101411;border-radius:14px;padding:22px;margin-top:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.jobs{width:100%;border-collapse:collapse;margin-top:15px}.jobs th,.jobs td{text-align:left;padding:14px 10px;border-bottom:1px solid #273027}.jobs th{font-size:12px;color:#9ca69b}.status{color:#cbee3f}.empty{padding:30px;text-align:center;color:#a3aca2}.user-email{font-size:13px;color:#a3aca2}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-wrap:wrap}.jobs th:nth-child(3),.jobs td:nth-child(3){display:none}.panel{padding:14px}.jobs th,.jobs td{padding:11px 5px;font-size:13px}}
  </style>
</head>
<body>
  <main class="workspace">
    <header class="top"><a class="auth-brand" href="/" aria-label="Vozia, início"><span class="brand-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Vozia</a><nav class="actions"><a class="primary" href="/#transcricao">Nova transcrição <span aria-hidden="true">→</span></a><a id="adminLink" href="/admin" hidden>Administração</a><button id="signOut">Sair</button></nav></header>
    <section class="welcome"><span class="auth-kicker">SEU ESPAÇO VOZIA</span><h1>Olá, <span id="displayName">…</span></h1><p class="muted user-email" id="userEmail"></p></section>
    <section class="panel"><div class="panel-head"><div><h2>Suas transcrições</h2><p class="muted">Arquivos associados à sua conta.</p></div><span class="status" id="transcriptionCount">—</span></div><div id="jobList"><p class="empty">Carregando seu espaço…</p></div></section>
    <section class="panel" id="transcriptPanel" hidden><div class="panel-head"><div><h2 id="transcriptTitle">Transcrição</h2><p class="muted" id="transcriptStatus">Aguardando processamento…</p></div><button class="job-link" id="downloadSrt" type="button" hidden>Baixar SRT</button></div><p class="muted" id="transcriptError" hidden></p><pre id="transcriptText" style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.8;color:#e8eee7;margin:18px 0 0"></pre></section>
    <div class="auth-notice" id="appNotice" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="/vozia-config.js"></script><script src="/supabase-client.js"></script><script src="/app.js"></script>
</body>
</html>
